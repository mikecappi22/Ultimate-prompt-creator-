<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Ultimate Prompt Creator V13 Text Only</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--muted:#64748b;--line:#dbe3ee;--blue:#2563eb;--green:#15803d;--red:#b91c1c;--purple:#6d28d9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:12px 10px 90px}.wrap{max-width:780px;margin:auto}.hero{background:linear-gradient(135deg,#0f172a,#334155);color:#fff;border-radius:24px;padding:17px}.hero h1{margin:0;font-size:24px}.hero p{margin:7px 0 0;color:#dbeafe;font-size:13px;line-height:1.45}.badge{display:inline-block;margin-top:10px;padding:5px 9px;border-radius:999px;background:#dcfce7;color:#166534;font-weight:900;font-size:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin:10px 0}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:10px 0}.tabs button{border:0;border-radius:999px;padding:11px;font-weight:850;background:#eef2f7;color:#334155}.tabs button.active{background:var(--blue);color:#fff}.panel{display:none}.panel.active{display:block}label{display:block;font-size:13px;font-weight:800;margin:9px 0 6px}textarea,input,select,button{font:inherit}textarea,input,select{width:100%;border:1px solid var(--line);border-radius:15px;padding:12px;background:#fff;color:var(--ink);font-size:16px}textarea{resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}button{border:0;border-radius:999px;padding:11px 14px;font-weight:850;cursor:pointer;min-height:44px}.primary{background:var(--blue);color:#fff}.secondary{background:#ede9fe;color:#5b21b6}.danger{background:#fee2e2;color:#b91c1c}.success{background:#dcfce7;color:#166534;border:1px solid #bbf7d0}.status{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.45}.status.good{color:var(--green);font-weight:800}.status.bad{color:var(--red);font-weight:800}.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.score{padding:8px;border:1px solid #e2e8f0;border-radius:14px}.score b{display:block;font-size:18px}.score span{font-size:10px;color:#64748b}.bubbles{display:flex;flex-wrap:wrap;gap:6px}.bubble{background:#dbeafe;color:#1d4ed8;border:1px solid #bfdbfe;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}.hidden{display:none!important}.small{font-size:12px;color:var(--muted);line-height:1.45}@media(max-width:620px){.grid2,.scores{grid-template-columns:1fr}.actions button{flex:1}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1>Ultimate Prompt Creator</h1><p>Private local-AI workspace for prompt direction and prompt building.</p><span class="badge">V13 TEXT ONLY</span></div>
<div class="card"><b>Private connection</b><div id="conn" class="status">Checking Ollama through this private connection…</div><div class="actions"><button id="check" class="primary">Check Ollama</button><button id="warm" class="secondary">Warm Text Model</button></div><div id="models" class="small"></div></div>
<div class="tabs"><button data-tab="director" class="active">🔥 Director</button><button data-tab="prompt">✨ Prompt</button></div>
<div id="panel-director" class="panel active"><div class="card"><h2 style="margin-top:0">AI Creative Director</h2><label>My raw idea</label><textarea id="idea" rows="6" placeholder="Describe your image idea in plain language…"></textarea><div class="grid2"><div><label>Performance</label><select id="dPerf"><option value="turbo" selected>⚡ Turbo</option><option value="balanced">Balanced</option><option value="maximum">Maximum</option></select></div><div><label>Local text model</label><select id="dModel"></select></div></div><div class="grid2"><div><label>Creative mode</label><select id="dMode"><option value="fascinating">Maximum fascination</option><option value="photoreal">Photorealistic</option><option value="cinematic">Cinematic</option><option value="editorial">Editorial</option><option value="candid">Candid</option></select></div><div><label>Target image model</label><select id="dTarget"><option>Universal</option><option>Grok Imagine</option><option>Flux</option><option>Midjourney</option><option>Seedream</option><option>Nano Banana</option></select></div></div><label>Extra direction</label><textarea id="dExtra" rows="2" placeholder="Optional extra instruction"></textarea><div class="actions"><button id="dRun" class="primary">🔥 Roast + Rebuild</button><button id="dCancel" class="danger" disabled>Cancel</button></div><div id="dStatus" class="status">Ready.</div></div><div id="dResults" class="hidden"><div class="card"><div id="dScores" class="scores"></div><label>Creative direction</label><textarea id="dDirection" rows="7" readonly></textarea><label>Recommended keywords</label><div id="dBubbles" class="bubbles"></div></div><div class="card"><label>Final rebuilt prompt</label><textarea id="dFinal" rows="13"></textarea><div class="actions"><button id="dToPrompt" class="success">Use in Prompt Workspace</button><button id="dCopy" class="secondary">Copy</button></div></div></div></div>
<div id="panel-prompt" class="panel"><div class="card"><h2 style="margin-top:0">Prompt Workspace</h2><textarea id="workspace" rows="20" placeholder="Build or edit your final prompt here…"></textarea><div class="actions"><button id="copyWorkspace" class="primary">Copy Prompt</button><button id="clearWorkspace" class="danger">Clear</button></div></div></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id),qa=s=>Array.from(document.querySelectorAll(s));const API='/ollama/api';const SCORE_KEYS=['overall','clarity','subject','wardrobe','pose_anatomy','camera','composition','lighting','material_realism','environment','fascination'];let models=[],ctl=null;
const SCHEMA={type:'object',additionalProperties:false,required:['scores','creative_direction','keywords','final_prompt'],properties:{scores:{type:'object',additionalProperties:false,required:SCORE_KEYS,properties:Object.fromEntries(SCORE_KEYS.map(k=>[k,{type:'integer',minimum:1,maximum:100}]))},creative_direction:{type:'string'},keywords:{type:'array',minItems:8,maxItems:14,items:{type:'object',additionalProperties:false,required:['keyword','prompt_phrase'],properties:{keyword:{type:'string'},prompt_phrase:{type:'string'}}}},final_prompt:{type:'string'}}};
function setStatus(id,msg,type=''){const e=$(id);if(e){e.textContent=msg;e.className='status '+type}}
function textModels(a){return a.filter(n=>/^qwen3:/i.test(n))}
function preferred(){return models.find(n=>n==='qwen3:1.7b')||models.find(n=>n==='qwen3:4b')||models[0]||''}
function cleanJSON(s){s=String(s||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a>=0&&b>a)s=s.slice(a,b+1);return JSON.parse(s)}
async function api(path,body=null,signal=null){const opt={method:body?'POST':'GET',headers:{Accept:'application/json'},cache:'no-store',signal};if(body){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(body)}const r=await fetch(API+path,opt),txt=await r.text();if(!r.ok)throw new Error('HTTP '+r.status+' '+txt.slice(0,300));return txt?JSON.parse(txt):{}}
async function check(){try{setStatus('conn','Checking private Ollama connection…');const j=await api('/tags');models=textModels((j.models||[]).map(x=>x.name||x.model).filter(Boolean));const sel=$('dModel');sel.innerHTML='';for(const m of models)sel.add(new Option(m,m));const p=preferred();if(p)sel.value=p;if(!models.length)throw new Error('No qwen3 text model is installed.');setStatus('conn','Connected to Ollama on your Windows PC.','good');$('models').textContent='Text models: '+models.join(' · ');return true}catch(e){setStatus('conn','Connection failed: '+e.message,'bad');return false}}
async function warm(){if(!models.length&&!(await check()))return;const model=$('dModel').value||preferred();setStatus('conn','Warming '+model+'…');try{await api('/chat',{model,messages:[{role:'user',content:'Reply READY'}],stream:false,think:false,keep_alive:'30m',options:{num_predict:8,num_ctx:1024,temperature:0}});setStatus('conn','Text model warmed.','good')}catch(e){setStatus('conn','Warm-up failed: '+e.message,'bad')}}
function perf(){const v=$('dPerf').value;if(v==='maximum')return{tok:3200,ctx:8192,temp:.48};if(v==='balanced')return{tok:2300,ctx:6144,temp:.40};return{tok:1800,ctx:4096,temp:.32}}
function prompt(){return `Act as an elite AI image-prompt creative director and prompt engineer. Preserve every explicit user fact while making the concept visually specific, photographically coherent, physically believable, and compelling. Improve camera, composition, lighting, pose, wardrobe/material construction, environment, texture, and narrative impact without generic quality-token stuffing.\n\nRAW IDEA:\n${$('idea').value.trim()}\n\nCREATIVE MODE: ${$('dMode').value}\nTARGET IMAGE MODEL: ${$('dTarget').value}\nEXTRA DIRECTION: ${$('dExtra').value.trim()||'none'}\n\nReturn JSON only. Give all 11 scores as integers 1-100, 8-14 concrete keyword/prompt-phrase pairs, a 3-5 sentence creative direction, and one detailed copy/paste-ready final prompt around 170-300 words. Do not invent identity facts, tattoos, logos, measurements, or hidden details.`}
function issues(o){const a=[];if(!o||!o.scores||SCORE_KEYS.some(k=>Number(o.scores[k])<1||Number(o.scores[k])>100))a.push('score validation');if(!Array.isArray(o?.keywords)||o.keywords.length<8)a.push('keyword count');if(String(o?.creative_direction||'').length<100)a.push('creative direction depth');if(String(o?.final_prompt||'').length<550)a.push('final prompt depth');return a}
async function call(userPrompt,model,p,signal){const j=await api('/chat',{model,messages:[{role:'user',content:userPrompt}],stream:false,think:false,format:SCHEMA,keep_alive:'30m',options:{num_predict:p.tok,num_ctx:p.ctx,temperature:p.temp}},signal);return cleanJSON(j.message?.content||'')}
async function run(){if(!$('idea').value.trim()){setStatus('dStatus','Type an idea first.','bad');return}if(!models.length&&!(await check()))return;const model=$('dModel').value||preferred();ctl=new AbortController();$('dRun').disabled=true;$('dCancel').disabled=false;setStatus('dStatus','Creative Director is analyzing and rebuilding your idea…');try{const p=perf();let o=await call(prompt(),model,p,ctl.signal);let bad=issues(o);if(bad.length){setStatus('dStatus','Quality check caught '+bad.length+' issue'+(bad.length===1?'':'s')+' — repairing once…');o=await call(`Repair this JSON. Fix: ${bad.join('; ')}. Preserve the raw idea exactly. Return the full corrected object only. RAW IDEA: ${$('idea').value.trim()}\nPREVIOUS: ${JSON.stringify(o)}`,model,{tok:Math.max(2200,p.tok),ctx:Math.max(6144,p.ctx),temp:.25},ctl.signal)}render(o);setStatus('dStatus','Creative Director complete using '+model+'.','good')}catch(e){setStatus('dStatus',e.name==='AbortError'?'Cancelled.':'Director failed: '+e.message,'bad')}finally{$('dRun').disabled=false;$('dCancel').disabled=true;ctl=null}}
function render(o){$('dResults').classList.remove('hidden');$('dScores').innerHTML=SCORE_KEYS.map(k=>`<div class="score"><b>${Math.max(1,Math.min(100,Math.round(Number(o.scores?.[k])||35)))}</b><span>${k.replaceAll('_',' ')}</span></div>`).join('');$('dDirection').value=o.creative_direction||'';const kb=$('dBubbles');kb.innerHTML='';for(const x of o.keywords||[]){const b=document.createElement('span');b.className='bubble';b.textContent=x.keyword||x.prompt_phrase;b.title=x.prompt_phrase||'';kb.appendChild(b)}$('dFinal').value=o.final_prompt||''}
function showTab(t){qa('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));qa('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+t))}
qa('.tabs button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));$('check').onclick=check;$('warm').onclick=warm;$('dRun').onclick=run;$('dCancel').onclick=()=>ctl?.abort();$('dToPrompt').onclick=()=>{$('workspace').value=$('dFinal').value;showTab('prompt')};$('dCopy').onclick=()=>navigator.clipboard?.writeText($('dFinal').value).catch(()=>{});$('copyWorkspace').onclick=()=>navigator.clipboard?.writeText($('workspace').value).catch(()=>{});$('clearWorkspace').onclick=()=>{$('workspace').value=''};check();
</script>
</body></html>
