<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mobile Fast Vision</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f5f8}.top{height:54px;display:flex;align-items:center;gap:8px;padding:8px 10px;background:#fff;border-bottom:1px solid #dbe3ee}.top a{background:#ede9fe;color:#5b21b6;text-decoration:none;border-radius:999px;padding:9px 12px;font-weight:800;font-size:12px}.status{font-size:11px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.frame{width:100%;height:calc(100% - 54px);border:0;display:block}</style></head>
<body><div class="top"><a href="mobile-v117.html">← Mobile Home</a><div id="s" class="status">Loading Fast Vision…</div></div><iframe id="f" class="frame" src="vision-lab-v116.html"></iframe>
<script>
const KEY='upc_mobile_ollama_endpoint_v117',PROF='upc_mobile_vision_profile_v117',f=document.getElementById('f'),s=document.getElementById('s');
f.addEventListener('load',()=>{try{const d=f.contentDocument,ep=localStorage.getItem(KEY)||'',p=localStorage.getItem(PROF)||'turbo';const e=d.getElementById('endpoint'),pr=d.getElementById('profile');if(e&&ep)e.value=ep;if(pr){pr.value=p;pr.dispatchEvent(new Event('change',{bubbles:true}))}s.textContent=ep?'Using '+ep:'No mobile endpoint saved — tap Mobile Home to configure.';const chk=d.getElementById('check');if(chk&&ep)setTimeout(()=>chk.click(),200)}catch(err){s.textContent='Could not apply mobile connection: '+err.message}});
</script></body></html>
