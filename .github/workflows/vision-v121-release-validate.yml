name: Vision V12.1 Release Validate

on:
  push:
    paths:
      - 'test-vision-v121-release.js'
      - 'install-vision-v121-release.ps1'
      - '.github/workflows/vision-v121-release-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check vision-v121-quality-speed.js
      - name: Corrected release regression suite
        run: node test-vision-v121-release.js
      - name: Compare V12.1 Turbo budget against working V12
        run: |
          node - <<'NODE'
          require('./vision-v12-clean.js');
          const oldCfg=globalThis.VisionV12Internals.MODES.turbo;
          require('./vision-v121-quality-speed.js');
          const n=globalThis.VisionV121Internals.MODES.turbo;
          const checks=[
            ['image px',oldCfg.px,n.px],
            ['vision tokens',oldCfg.vTok,n.vTok],
            ['vision context',oldCfg.vCtx,n.vCtx],
            ['structure tokens',oldCfg.sTok,n.sTok],
            ['structure context',oldCfg.sCtx,n.sCtx]
          ];
          for(const [name,before,after] of checks){
            console.log(`${name}: ${before} -> ${after}`);
            if(!(after<before))throw new Error(`${name} did not decrease`);
          }
          const visionTokenReduction=1-(n.vTok/oldCfg.vTok);
          const structTokenReduction=1-(n.sTok/oldCfg.sTok);
          console.log('Vision token reduction:',(visionTokenReduction*100).toFixed(1)+'%');
          console.log('Structure token reduction:',(structTokenReduction*100).toFixed(1)+'%');
          if(visionTokenReduction<0.25)throw new Error('Vision token reduction is too small');
          if(structTokenReduction<0.25)throw new Error('Structure token reduction is too small');
          NODE
      - name: Verify no Moondream route and confidence protections
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('vision-v121-quality-speed.js','utf8');
          if(/model\s*[:=][^\n]{0,100}moondream/i.test(src))throw new Error('Moondream model route found');
          if(/\/generate[^\n]{0,300}moondream/i.test(src))throw new Error('Moondream generate route found');
          for(const marker of ['BANNED_CERTAINTY','format:STRUCT_SCHEMA','px:320','VisionV121Internals','Never promote uncertainty to certainty']){
            if(!src.includes(marker))throw new Error('missing marker '+marker);
          }
          if(src.includes('URL.createObjectURL'))throw new Error('Safari-unsafe object URL found');
          console.log('Routing + confidence safeguards PASS');
          NODE
      - name: Assemble final candidate page
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const shell=fs.readFileSync('vision-v121-shell.html','utf8');
          const js=fs.readFileSync('vision-v121-quality-speed.js','utf8');
          if(!shell.includes('<!-- VISION_V121_SCRIPT -->'))throw new Error('shell injection marker missing');
          const page=shell.replace('<!-- VISION_V121_SCRIPT -->',`<script>\n${js}\n</script>`);
          fs.writeFileSync('/tmp/vision-v121-release.html',page);
          for(const marker of ['V12.1 QUALITY + SPEED','class ProgressTracker','BANNED_CERTAINTY','px:320','confidence estimated']){
            if(!page.includes(marker))throw new Error('assembled page missing '+marker);
          }
          console.log('Final assembled candidate PASS',page.length,'bytes');
          NODE

  release-windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Parse release launcher with Windows PowerShell
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\install-vision-v121-release.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors -and $errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_.Message};exit 1}
          Write-Host 'Release launcher parser PASS'
      - name: Reproduce release patch on transactional installer
        shell: powershell
        run: |
          $base=Get-Content '.\install-vision-v121-quality-speed.ps1'
          $bad=@($base|Where-Object{$_ -match 'Moondream routing unexpectedly found in V12\.1'})
          if($bad.Count -ne 1){throw "Expected one obsolete line; found $($bad.Count)"}
          $filtered=@($base|Where-Object{$_ -notmatch 'Moondream routing unexpectedly found in V12\.1'})
          $tmp=Join-Path $env:TEMP 'v121-release-patched.ps1'
          $filtered|Set-Content $tmp -Encoding UTF8
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile($tmp,[ref]$tokens,[ref]$errors)|Out-Null
          if($errors -and $errors.Count -gt 0){$errors|ForEach-Object{Write-Error $_.Message};exit 1}
          $s=Get-Content $tmp -Raw
          $required=@('589c1a9267e3ea96cafc28820a1db8a677d4535e','index-v121-candidate.html','Rollback backup','ROLLBACK PASS','Restart-PrivateBridge','BANNED_CERTAINTY','format:STRUCT_SCHEMA','px:320','V12.1 QUALITY + SPEED IS READY')
          foreach($m in $required){if(-not $s.Contains($m)){throw "Patched installer missing safeguard: $m"}}
          if($s -match 'Moondream routing unexpectedly found in V12\.1'){throw 'Obsolete false-positive line survived patch'}
          Write-Host 'Exact release-patched transactional installer PASS'
      - name: Verify launcher is pinned to validated transactional installer
        shell: powershell
        run: |
          $s=Get-Content '.\install-vision-v121-release.ps1' -Raw
          if(-not $s.Contains('324d5dfc6261a310f94383279d22bf06753a8421')){throw 'Release launcher is not pinned to validated transactional installer commit'}
          if(-not $s.Contains('RELEASE INSTALLER LOCAL PARSER + SAFEGUARDS PASS')){throw 'Release launcher local gate missing'}
          Write-Host 'Release pin + local gate PASS'
