name: V11.9.2 PowerShell Parse

on:
  push:
    paths:
      - 'upgrade-mobile-vision-v1192.ps1'
      - '.github/workflows/v1192-powershell-parse.yml'
  workflow_dispatch:

jobs:
  parse:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\upgrade-mobile-vision-v1192.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors -and $errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Windows PowerShell parser PASS'
