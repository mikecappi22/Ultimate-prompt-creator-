name: Subject Vault Browser Storage Test

on:
  push:
    branches: [main]
    paths:
      - 'subject-vault-v132.js'
      - 'subject-profile-paste-v133.js'
      - 'tests/subject-vault-harness.html'
      - 'tests/test-subject-vault-browser.mjs'
      - '.github/workflows/subject-vault-browser-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-storage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 8000 > /tmp/upc-server.log 2>&1 &
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/tests/subject-vault-harness.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/upc-server.log
          exit 1
      - name: Run real-browser photo + profile prefill persistence test
        run: node tests/test-subject-vault-browser.mjs
