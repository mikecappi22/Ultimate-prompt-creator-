name: V11.9.4 Fast CPU Validate

on:
  push:
    paths:
      - 'mobile-v1194-fast-cpu.js'
      - 'install-upc-v1194-fast.ps1'
      - '.github/workflows/v1194-validate.yml'
  workflow_dispatch:

jobs:
  windows-parse:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer with Windows PowerShell
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\install-upc-v1194-fast.ps1'),[ref]$tokens,[ref]$errors) | Out-Null
          if($errors -and $errors.Count -gt 0){$errors | ForEach-Object { Write-Error $_.Message }; exit 1}
          Write-Host 'V11.9.4 Windows PowerShell parser PASS'
      - name: Verify adapter markers
        shell: powershell
        run: |
          $s=Get-Content '.\install-upc-v1194-fast.ps1' -Raw
          foreach($m in @('/api/generate','/api/chat','Qwen VL 2B fallback','V11.9.4 FAST CPU IS READY')){if(-not $s.Contains($m)){throw "Missing marker: $m"}}
          Write-Host 'Installer fallback markers PASS'

  js-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: JavaScript syntax check
        run: node --check mobile-v1194-fast-cpu.js
      - name: Verify CPU routing and fallback markers
        shell: bash
        run: |
          grep -q "Moondream /api/generate" mobile-v1194-fast-cpu.js
          grep -q "Moondream /api/chat" mobile-v1194-fast-cpu.js
          grep -q "Qwen VL 2B fallback" mobile-v1194-fast-cpu.js
          grep -q "px:384" mobile-v1194-fast-cpu.js
          echo 'V11.9.4 JS routing markers PASS'
