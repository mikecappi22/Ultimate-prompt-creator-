name: V13.1 Subject Vault Validate

on:
  push:
    branches: [main]
    paths:
      - 'feature-loader-v110.js'
      - 'subject-vault-v131.js'
      - 'text-director-v130.js'
      - 'mobile-bridge-v117.js'
      - 'mobile-v117.html'
      - 'private-text-only-v130.html'
      - 'install-text-only-v130.ps1'
      - 'index.html'
      - 'prompt-v8-mobile.html'
      - 'test-text-only-v130.js'
      - '.github/workflows/text-only-v130-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax checks
        run: |
          node --check feature-loader-v110.js
          node --check subject-vault-v131.js
          node --check text-director-v130.js
          node --check mobile-bridge-v117.js
      - name: V13.1 Subject Vault regression
        run: node test-text-only-v130.js
      - name: Verify active pages remain free of image-analysis stack
        run: |
          ! grep -Eiq 'deep-vision|photo-forensics|vision-lab|studio-lite-v110' index.html
          ! grep -Eiq 'deep-vision|photo-forensics|vision-lab|studio-lite-v110' prompt-v8-mobile.html
          grep -Fq 'V13.1 SUBJECT VAULT' feature-loader-v110.js
          grep -Fq 'subject-vault-v131.js' feature-loader-v110.js
          grep -Fq 'V13 TEXT ONLY' private-text-only-v130.html
          ! grep -Eiq '/api/chat|/api/generate|qwen3-vl|llava|gemma3|moondream' subject-vault-v131.js

  windows-installer:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer with Windows PowerShell
        shell: powershell
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path '.\install-text-only-v130.ps1'),[ref]$tokens,[ref]$errors)|Out-Null
          if($errors -and $errors.Count -gt 0){
            $errors|ForEach-Object{Write-Error $_.Message}
            exit 1
          }
          Write-Host 'Windows PowerShell parser PASS'
      - name: Verify transactional and cleanup safeguards
        shell: powershell
        run: |
          $s=Get-Content '.\install-text-only-v130.ps1' -Raw
          $required=@(
            '8f81e51205cd7dac94a029a299a21081fd843a48',
            'private-text-only-v130.html',
            'index-v130-text-only-candidate.html',
            'Restart-PrivateBridge',
            'ROLLBACK PASS',
            'qwen3:1.7b',
            'qwen3-vl|moondream',
            'V13 TEXT-ONLY PLATFORM IS READY'
          )
          foreach($m in $required){if(-not $s.Contains($m)){throw "Missing installer safeguard: $m"}}
          Write-Host 'Installer safeguards PASS'
