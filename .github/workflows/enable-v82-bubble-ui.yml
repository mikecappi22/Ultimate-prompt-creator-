name: Enable V8.2 Bubble UI

on:
  push:
    branches: [main]
    paths:
      - bubble-ui-v82-trigger.txt

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch Bubble UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [Path('index.html'), Path('prompt-v8-mobile.html')]
          marker = '/* V8.2 BUBBLE UI */'
          bubble_css = Path('bubble-ui-v82.css').read_text(encoding='utf-8').strip()

          for p in files:
              text = p.read_text(encoding='utf-8')
              if marker not in text:
                  if '</style>' not in text:
                      raise SystemExit(f'{p}: closing style tag not found')
                  text = text.replace('</style>', bubble_css + '\n</style>', 1)
              text = text.replace('<title>Ultimate Prompt Creator V8.1 Camera</title>', '<title>Ultimate Prompt Creator V8.2 Bubble UI</title>')
              text = text.replace('<span class="badge">V8.1 CAMERA</span>', '<span class="badge">V8.2 BUBBLE UI</span>')
              p.write_text(text, encoding='utf-8')
              print(f'{p}: bubble UI ready')
          PY

      - name: Validate Bubble UI
        shell: bash
        run: |
          grep -Fq '/* V8.2 BUBBLE UI */' index.html
          grep -Fq 'V8.2 BUBBLE UI' index.html
          grep -Fq 'border-radius:999px' index.html
          grep -Fq 'V8.2 BUBBLE UI' prompt-v8-mobile.html
          grep -Fq 'camera-addon-v81.part${n}.txt' index.html
          git diff --check

      - name: Commit Bubble UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No Bubble UI changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html prompt-v8-mobile.html
          git commit -m 'Add V8.2 colorful bubble UI'
          git push
